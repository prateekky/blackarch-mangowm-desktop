# BlackArch + MangoWM
source_optional=~/.config/mango/monitors.conf
# Clean Wayland setup using Waybar, Fuzzel, Mako and Foot.

animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_move=240
animation_duration_open=180
animation_duration_tag=180
animation_duration_close=180
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.22,1.0,0.36,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.46,1.0,0.29,1

blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=9
no_radius_when_single=0

new_is_master=1
default_master_factor=0.58
default_master_count=1
tag_num=9
tag_carousel=1
smart_gaps=0

no_border_when_single=0
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
cursor_size=24

repeat_rate=35
repeat_delay=500
numlock_on=1
xkb_rules_layout=us

gap_inner_horizontal=7
gap_inner_vertical=7
gap_outer_horizontal=12
gap_outer_vertical=12
border_px=2
root_color=0x101116ff
border_color=0x30323cff
focus_color=0xf04452ff
urgent_color=0xff5964ff
maximized_screen_color=0xf04452ff
split_color=0x5d6475ff

# Applications
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,e,spawn,nemo
bind=SUPER,t,spawn,foot
bind=SUPER,b,spawn,firefox
bind=SUPER,s,spawn,spotify-launcher
bind=SUPER,z,spawn,zapzap
bind=SUPER,w,spawn,firefox
bind=SUPER,m,spawn,foot -e btop
bind=CTRL+ALT,Delete,spawn,foot -e btop
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen all
bind=ALT,Print,spawn,noctalia msg screenshot-annotate

# Window control
bind=SUPER,r,reload_config
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,quit
bind=SUPER,Tab,spawn,noctalia msg window-switcher hold
bind=SUPER,d,toggleoverview
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left,0
bind=SUPER+CTRL+SHIFT,j,tagmon,down,0
bind=SUPER+CTRL+SHIFT,k,tagmon,up,0
bind=SUPER+CTRL+SHIFT,l,tagmon,right,0
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left,0
bind=SUPER+CTRL+SHIFT,Right,tagmon,right,0
bind=SUPER+CTRL+SHIFT,Up,tagmon,up,0
bind=SUPER+CTRL+SHIFT,Down,tagmon,down,0
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+SHIFT,t,togglefloating
# Resize the focused window on all four edges (adapted from DMS width/height binds).
bind=SUPER,equal,resizewin,+100,+0
bind=SUPER,minus,resizewin,-100,+0
bind=SUPER+SHIFT,equal,resizewin,+0,+80
bind=SUPER+SHIFT,minus,resizewin,+0,-80
# Keep master-area sizing available on the Ctrl variants.
bind=SUPER+CTRL,equal,setmfact,+0.05
bind=SUPER+CTRL,minus,setmfact,-0.05
bind=ALT,f,togglefullscreen
bind=ALT,space,togglefloating
bind=ALT,n,switch_layout

# Noctalia panels, clipboard, settings, wallpaper, and session actions
bind=SUPER,c,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,n,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER,y,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER,p,spawn,/home/turbocyborg/.local/bin/mango-display-profile --select
bind=SUPER+SHIFT,p,sleep_toggle_monitor,eDP-1
bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,Page_Down,viewtoright_have_client,0
bind=SUPER+SHIFT,Page_Up,tagtoleft,0
bind=SUPER+SHIFT,Page_Down,tagtoright,0
bind=SUPER,u,viewtoright_have_client,0
bind=SUPER,i,viewtoleft_have_client,0
bind=SUPER+CTRL,Down,tagtoright,0
bind=SUPER+CTRL,Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

# Workspaces
# Super+1..9 switches workspaces; Super+Shift+1..9 sends the focused window there.
# Super+Ctrl+Up/Down and Super+Ctrl+U/I send it to the adjacent workspace.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Volume, playback and brightness
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 3
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down 3
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=CTRL,XF86AudioRaiseVolume,spawn,noctalia msg media volume-up 3
bind=CTRL,XF86AudioLowerVolume,spawn,noctalia msg media volume-down 3
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up 5
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down 5

# Session services
exec_once=/usr/bin/noctalia
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Trackpad gestures: navigate windows, switch workspaces, and control tiling.
gesture_live=1
gesture_swipe_distance=300
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=10
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoright,0
gesturebind=none,right,4,viewtoleft,0
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
gesturebind=super,left,3,move_client,left
gesturebind=super,right,3,move_client,right
gesturebind=super,up,3,move_client,up
gesturebind=super,down,3,move_client,down

# Explicit DMS-style mouse controls (the per-user config does not inherit system defaults).
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,focusstack,prev
axisbind=SUPER,DOWN,focusstack,next
axisbind=SUPER+CTRL,UP,tagtoleft,0
axisbind=SUPER+CTRL,DOWN,tagtoright,0

# Allow pointer reordering of tiled windows and cross-monitor window moves.
drag_tile_to_tile=1
exchange_cross_monitor=1

# Show a compact live preview while dragging tiled windows.
drag_tile_small=1

# Super+Shift scroll cycles workspaces; Ctrl+Shift scroll moves windows across monitors.
axisbind=SUPER+SHIFT,UP,viewtoleft,0
axisbind=SUPER+SHIFT,DOWN,viewtoright,0
axisbind=SUPER+CTRL+SHIFT,UP,tagmon,prev,0
axisbind=SUPER+CTRL+SHIFT,DOWN,tagmon,next,0
